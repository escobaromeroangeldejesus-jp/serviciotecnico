{% extends 'base.html' %}
{% block content %}

    <div class="container py-4">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow">

                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">
                            <i class="bi bi-star-fill"></i>
                            Valorar reparación
                        </h4>
                    </div>

                    <div class="card-body">

                        <h5>
                            Reparación #{{ reparacion.id }}
                        </h5>

                        <p class="text-muted mb-1">
                            {{ reparacion.equipo }}
                        </p>

                        <p>
                            Técnico:
                            <strong>
                                {{ reparacion.tecnico }}
                            </strong>
                        </p>

                        <hr>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="text-center mb-4">

                                <label class="form-label fw-bold">
                                    ¿Cómo calificarías la atención?
                                </label>

                                <div id="estrellas"
                                    class="estrellas">

                                    <i class="bi bi-star estrella"
                                        data-value="1"></i>

                                    <i class="bi bi-star estrella"
                                        data-value="2"></i>

                                    <i class="bi bi-star estrella"
                                        data-value="3"></i>

                                    <i class="bi bi-star estrella"
                                        data-value="4"></i>

                                    <i class="bi bi-star estrella"
                                        data-value="5"></i>

                                </div>

                                <p id="texto-estrellas"
                                    class="text-muted mt-2">
                                    Seleccioná una puntuación
                                </p>

                            </div>


                            <!-- Campo real que recibe Django -->

                            <div class="d-none">

                                {{ form.estrellas }}

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Comentario
                                </label>

                                {{ form.comentario }}

                            </div>


                            <div class="d-flex justify-content-between">

                                <a href="{% url 'myapp:reparaciones' %}"
                                    class="btn btn-secondary">

                                    Cancelar

                                </a>

                                <button type="submit"
                                        class="btn btn-warning">

                                    <i class="bi bi-send"></i>

                                    Enviar opinión

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

{% endblock %}
